[workspace]
resolver = "2"
members = ["crates/snb-core", "crates/snb-updater", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Sky & Beyond"]
rust-version = "1.77.2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

[profile.dev]
incremental = true
