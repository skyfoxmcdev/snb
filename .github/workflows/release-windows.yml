name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Tests
        run: cargo test -p snb-core -p snb-updater
      - name: Build updater sidecar
        run: npm run sidecar
      - name: Build NSIS installer
        run: npm run tauri build
      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer was produced." }
          Copy-Item $installer.FullName "artifacts/Sky-and-Beyond_${version}_x64-setup.exe"
          Get-ChildItem artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: sky-and-beyond-windows-installer
          path: artifacts/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          generate_release_notes: true
